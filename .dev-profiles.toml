# Which development workflow this repository uses. `dev-profiles doctor` reads this file.
#
# This marker is the only workflow signal anything outside .dev-profiles/ reads. Names that belong to one
# profile — `changesets/`, ABOUT.md, Review-State trailers, git pair commands — must not appear here or in
# any generic layer. They do not appear here for one reason: this file is written for the library, and a
# consumer that has to special-case one repository is a consumer that cannot be adopted by the next.
library = ".dev-profiles/profiles"

# Skills matching these names must not be discoverable while the declared profiles are active. Only standards
# belong here: a standard prescribes one route for every repository, which is the conflict this file settles.
# Capabilities (git-pair, gh-cli) are tools and stay available.
forbidden = ["git-workflow"]

# The loop: branch, commit, changeset, review, hand-off. This repository runs it — `changesets/`, the
# Review-State trailers and the approval commits are its own product's workflow, dogfooded here.
#
# The merge side of the workflow, declared. This profile is the one that promises a verified merge, and it is also
# the one that *ships* the job: `.github/workflows/git-pair-check.yml`, `.github/workflows/git-pair-integrate.yml`,
# `scripts/ci/git-pair-integrate.sh` and `scripts/ci/install-git-pair.sh` are the profile's bytes in this tree —
# `install` writes them, `doctor` byte-compares them and their exec bits, and a committed copy matching neither is a
# stray. They are not product code here any more, and a reader who wants the annotated account of why there are two
# files, what each scope is for, and why nothing runs on a timer opens the profile's `git-pair-github-integration`
# skill rather than a workflow header.
#
# What made this adoptable is the preparation the jobs run after the pinned install, and it is worth being exact
# about why. This repository's merge cannot be gated by a published release: the release does not contain the change
# under review, so the job has to build the tool from the tree. The profile installs the pinned release first and
# then runs this repository's preparation, in both jobs, so the binary that gates the merge is the one this tree
# produced and the installer's copy is what gets replaced. That preparation is the composite action at
# `.github/actions/git-pair-setup/action.yml`, called by both files behind a guard on the file's own existence. It
# used to be the profile's `toolchain` seam, which v8 retired: a shell fragment `eval`'d inside a step could reach
# `$GITHUB_ENV` only because `run:` hands it that variable, and could not give the step its own `if:`, `env:` or
# `timeout-minutes`.
#
# Three repository variables steer these files, and none of them is a decision about the shape — which is why they are
# variables rather than edits to installed bytes. `GIT_PAIR_BASE` names the destination branch, and the files fall
# back to `main`; `GIT_PAIR_VERSION` pins the release `install-git-pair.sh` fetches, which is what keeps a runner from
# testing trunk's development binary instead of a named one; `GIT_PAIR_TIMEOUT` is the ceiling both jobs run under,
# where the profile's default is 30 and this repository wants the 20 it set before, because `gates` is a ladder of
# suites and a hung replay should stop rather than run to the ceiling. `vars` is the only context GitHub lets
# `timeout-minutes` read, so the marker cannot hold it and the variable is where a tuning dial belongs.
[[profile]]
name = "git-pair-loop"
version = 3

[[profile]]
name = "git-pair-github-integration"
version = 9

# The answers those files ask for, with one definition of green behind all of them. `verify` is required — a
# merge conditional on nothing is the shape with its point removed — while `ci-request` is an offer:
# leaving it unanswered is legal and the job says so in the log, whereas a misspelled key fails `doctor` at the
# handoff instead of quietly becoming "nothing to do". The third thing the jobs ask for is not a key: the
# preparation is a composite action the profile names by path and this repository writes, because GitHub resolves a
# local `uses:` while it reads the workflow, and `doctor` fails a file at that path which is not a composite action.
#
# `verify` is `mise run gates`, which is what `.github/workflows/git-pair-check.yml` runs on a pull request, what the
# merge job runs against the tree the destination would become, and what `scripts/gates/` drives in its replays — one
# copy of "done", in `.mise.toml`.
#
# The composite action runs `scripts/ci/prepare-toolchain.sh`, and it stays a script rather than YAML steps because
# it has three things to do and one of them is handing the steps after it a value: it installs mise and the Go
# `.mise.toml` pins, builds, and exports `GIT_PAIR_BIN` as the branch-named binary `scripts/install-name.sh`
# derives. That export is what makes the driver and the queue report at the end of the merge job ask the tool this
# tree built rather than the release the installer left behind, and it is the reason the step sits after the install
# and not before it.
#
# `ci-request` names the helper that asks for a run of the destination's new tip. The file it asks for is
# `git-pair-check.yml` — by path, not by the display name in its `name:` key — which merges nothing, and that is what
# makes the ask safe to grant.
[commands]
verify = "mise run gates"
ci-request = "scripts/ci/gh-request-ci.sh"

# Which capabilities this repository needs, and where each lives. No commands here: the capability's manifest
# owns those, so the marker states a requirement and the capability answers how to satisfy it.
[[capability]]
name = "git-pair"
# The tool owns this skill and installs it (`git pair skill install`). Committing a copy here would give this
# repository a second skill to keep current, and the tool upgrades independently of it. In this repository the
# drift check compares the machine copy against the *released* binary, while `mise run build` installs one
# named after the branch — so the check answers a question about the developer's machine, not about the tree.
scope = "machine"
required = true
[capability.options]
harness = "agents"

[[capability]]
name = "change-description"
# The change-record standard, installed into the checkout: a reviewer reads it in this repository's changesets,
# so it is this repository's promise and not a per-developer one.
scope = "repo"
required = true
