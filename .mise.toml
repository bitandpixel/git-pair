[tools]
go = "1.27.1"

# Tasks run with the mise toolchain active and from this file's directory, so
# `go` is already 1.27.1 and each task works from any subdirectory of the repo.

# Compiles and installs straight onto PATH, so the binary you test is the one you
# just edited. Deliberately `go build -o` rather than `go install`: GOBIN points
# inside the mise-managed Go installation, and anything installed there is
# discarded on the next Go upgrade.
[tasks.build]
run = "go build -o \"$HOME/.local/bin/git-pair\" ./cmd/git-pair"
description = "Compile and install git-pair onto ~/.local/bin (already on PATH)"

# Just the test suite, for a fast focused loop.
[tasks.test]
run = "go test ./..."
description = "Run the Go test suite"

# The full gate: formatting, vet, then tests. `check` is what to run before
# calling a change done; `test` is what to run while iterating.
[tasks.check]
run = """
set -eu
unformatted=$(gofmt -l internal cmd)
if [ -n "$unformatted" ]; then
  echo "not gofmt-clean:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
go test ./...
"""
description = "gofmt + vet + tests"
