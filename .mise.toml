[tools]
go = "1.27.1"

# Tasks run with the mise toolchain active and from this file's directory, so
# `go` is already 1.27.1 and each task works from any subdirectory of the repo.

# Compiles and installs straight onto PATH, so the binary you test is the one you
# just edited. Deliberately `go build -o` rather than `go install`: GOBIN points
# inside the mise-managed Go installation, and anything installed there is
# discarded on the next Go upgrade.
#
# The install name comes from scripts/install-name.sh, which namespaces it by the branch
# it was built from. That is not decoration: this repository is worked in several
# worktrees at once and ~/.local/bin is one shared directory, so whichever worktree
# built last would be the binary every other one was pretending to test — and the gate
# scripts under scripts/gates resolve the same name, so a replay cannot quietly run a build
# left behind by a different branch. Trunk keeps the plain name, and `build:prod` below
# writes it from anywhere: overwriting the shared binary is sometimes the point, and is
# never supposed to be a surprise.
[tasks.build]
run = """
set -eu
name=$(sh scripts/install-name.sh)
mkdir -p "$HOME/.local/bin"
go build -o "$HOME/.local/bin/$name" ./cmd/git-pair
if [ "$name" = git-pair ]; then
  echo "installed ~/.local/bin/git-pair - this is the binary 'git pair' runs"
else
  echo "installed ~/.local/bin/$name (from $(git branch --show-current))"
  echo "run it as '$name ...'; 'git pair' is still ~/.local/bin/git-pair, and the gate"
  echo "scripts under scripts/gates default to the name just installed"
fi
"""
description = "Compile and install onto ~/.local/bin as git-pair-<branch> (trunk installs the plain name)"

# The shared name, from wherever you happen to be standing, said out loud: writing it
# from a branch replaces the binary every other worktree and every `git pair` in the
# shell sees, which is sometimes exactly what is wanted and never what should happen
# by surprise.
[tasks."build:prod"]
run = """
set -eu
branch=$(git branch --show-current)
if [ -z "$branch" ]; then branch="detached HEAD"; fi
mkdir -p "$HOME/.local/bin"
go build -o "$HOME/.local/bin/git-pair" ./cmd/git-pair
echo "installed ~/.local/bin/git-pair from $branch - this replaces the binary 'git pair' runs"
"""
description = "Install the shared ~/.local/bin/git-pair from any branch"

# The test suite, sharded across processes.
#
# The suite is subprocess-bound: a test's span is mostly a git subprocess, and one `go test`
# process cannot overlap those, because `internal/cli` and `internal/tui` drive the product through
# the process working directory and the process standard streams and therefore serialise their own
# tests. scripts/test-sharded.sh splits a package's tests over several `go test` processes by name,
# which keeps each process single-threaded exactly as it is today and lets the git work overlap.
# See the header of that script for what it does and why it is safe.
#
# It takes `-n SHARDS` and `-P WORKERS`; `GIT_PAIR_TEST_SHARDS=1` is the old behaviour.
[tasks.test]
run = "bash scripts/test-sharded.sh"
description = "Run the Go test suite in parallel processes (test:serial for one process)"

# One `go test` process over everything: the same tests, in package order, with the output
# `go test ./...` gives. Use it when a shard's failure output is harder to read than the plain run,
# or when you want the run pinned to a single process on purpose.
[tasks."test:serial"]
run = "go test ./..."
description = "Run the Go test suite in one process"

# The scripted replays. `check` covers the unit and integration layers; these drive the real CLI as a
# subprocess, so they catch what a Go test cannot: a workflow step whose exit code or wording changed, a TUI
# that paints the wrong thing, and a repository shape a Go fixture never builds — a clone of a remote, which
# is what the CI job runs in and what `ci-integrate` replays against scratch bare remotes. They resolve the
# binary the same way `build` names it, so `build` first is what makes the replay test this checkout.
[tasks.gates]
run = """
set -eu
mise run build
bash scripts/gates/e2e-29.sh
bash scripts/gates/pty-walkthrough.sh
bash scripts/gates/ci-integrate.sh
"""
depends = ["check"]
description = "check, then replay the PRD §29 loop, the pty TUI walkthrough, and the CI merge job (needs python3)"

# The full gate: formatting, vet, then tests. `check` is what to run before
# calling a change done; `test` is what to run while iterating.
[tasks.check]
run = """
set -eu
unformatted=$(gofmt -l internal cmd)
if [ -n "$unformatted" ]; then
  echo "not gofmt-clean:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
bash scripts/test-sharded.sh
"""
description = "gofmt + vet + tests (sharded; test:serial runs them in one process)"
