[tools]
go = "1.27.1"
# The release packager, pinned beside Go so `mise run release:*` and the Release workflow agree on one
# goreleaser. `.goreleaser.yaml` says `version: 2`, which an older binary would reject, and a workflow
# that installed its own would be a second definition of the release — the same rule `ci.yml` states for
# the gate. It costs every checkout a download; the alternative, ad-hoc `mise x` in each task, hides the
# version from anyone reading this file.
goreleaser = "2.18.2"

# Tasks run with the mise toolchain active and from this file's directory, so
# `go` is already 1.27.1 and each task works from any subdirectory of the repo.

# Compiles and installs straight onto PATH, so the binary you test is the one you
# just edited. Deliberately `go build -o` rather than `go install`: GOBIN points
# inside the mise-managed Go installation, and anything installed there is
# discarded on the next Go upgrade.
#
# The install name comes from scripts/install-name.sh, which namespaces it by the branch
# it was built from. That is not decoration: this repository is worked in several
# worktrees at once and ~/.local/bin is one shared directory, so whichever worktree
# built last would be the binary every other one was pretending to test — and the gate
# scripts under scripts/gates resolve the same name, so a replay cannot quietly run a build
# left behind by a different branch. Trunk keeps the plain name, and `build:prod` below
# writes it from anywhere: overwriting the shared binary is sometimes the point, and is
# never supposed to be a surprise.
#
# The version is stamped the same way the name is resolved: one script, both build tasks. A build from a
# commit with no tag has no version to report, so `mise run build` installs a binary that prints
# `0.0.0-dev+<sha>` — a value no release can be named, because a release is named by its tag, and the
# commit is the thing a bug report needs. A plain `go build` skips the stamp and prints the fallback at
# `internal/cli/root.go:Version`, which is the same answer with nothing to name the commit by.
[tasks.build]
run = """
set -eu
name=$(sh scripts/install-name.sh)
version=$(sh scripts/dev-version.sh)
mkdir -p "$HOME/.local/bin"
go build -ldflags "-X gitpair/internal/cli.Version=$version" -o "$HOME/.local/bin/$name" ./cmd/git-pair
if [ "$name" = git-pair ]; then
  echo "installed ~/.local/bin/git-pair at $version - this is the binary 'git pair' runs"
else
  echo "installed ~/.local/bin/$name at $version (from $(git branch --show-current))"
  echo "run it as '$name ...'; 'git pair' is still ~/.local/bin/git-pair, and the gate"
  echo "scripts under scripts/gates default to the name just installed"
fi
"""
description = "Compile and install onto ~/.local/bin as git-pair-<branch> (trunk installs the plain name)"

# The shared name, from wherever you happen to be standing, said out loud: writing it
# from a branch replaces the binary every other worktree and every `git pair` in the
# shell sees, which is sometimes exactly what is wanted and never what should happen
# by surprise. The version is stamped the same way, from the same script, so the shared binary says
# which commit it was built from whichever worktree wrote it last.
[tasks."build:prod"]
run = """
set -eu
branch=$(git branch --show-current)
if [ -z "$branch" ]; then branch="detached HEAD"; fi
version=$(sh scripts/dev-version.sh)
mkdir -p "$HOME/.local/bin"
go build -ldflags "-X gitpair/internal/cli.Version=$version" -o "$HOME/.local/bin/git-pair" ./cmd/git-pair
echo "installed ~/.local/bin/git-pair at $version from $branch - this replaces the binary 'git pair' runs"
"""
description = "Install the shared ~/.local/bin/git-pair from any branch"

# The test suite, sharded across processes.
#
# The suite is subprocess-bound: a test's span is mostly a git subprocess, and one `go test`
# process cannot overlap those, because `internal/cli` and `internal/tui` drive the product through
# the process working directory and the process standard streams and therefore serialise their own
# tests. scripts/test-sharded.sh splits a package's tests over several `go test` processes by name,
# which keeps each process single-threaded exactly as it is today and lets the git work overlap.
# See the header of that script for what it does and why it is safe.
#
# It takes `-n SHARDS` and `-P WORKERS`; `GIT_PAIR_TEST_SHARDS=1` is the old behaviour.
[tasks.test]
run = "bash scripts/test-sharded.sh"
description = "Run the Go test suite in parallel processes (test:serial for one process)"

# One `go test` process over everything: the same tests, in package order, with the output
# `go test ./...` gives. Use it when a shard's failure output is harder to read than the plain run,
# or when you want the run pinned to a single process on purpose.
[tasks."test:serial"]
run = "go test ./..."
description = "Run the Go test suite in one process"

# The scripted replays. `check` covers the unit and integration layers; these drive the real CLI as a
# subprocess, so they catch what a Go test cannot: a workflow step whose exit code or wording changed, a TUI
# that paints the wrong thing, and a repository shape a Go fixture never builds — a clone of a remote, which
# is what the CI job runs in and what `ci-integrate` replays against scratch bare remotes. They resolve the
# binary the same way `build` names it, so `build` first is what makes the replay test this checkout.
[tasks.gates]
run = """
set -eu
mise run build
bash scripts/gates/e2e-29.sh
bash scripts/gates/pty-walkthrough.sh
bash scripts/gates/ci-integrate.sh
"""
depends = ["check"]
description = "check, then replay the PRD §29 loop, the pty TUI walkthrough, and the CI merge job (needs python3)"

# The full gate: formatting, vet, then tests. `check` is what to run before
# calling a change done; `test` is what to run while iterating.
[tasks.check]
run = """
set -eu
unformatted=$(gofmt -l internal cmd)
if [ -n "$unformatted" ]; then
  echo "not gofmt-clean:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
bash scripts/test-sharded.sh
"""
description = "gofmt + vet + tests (sharded; test:serial runs them in one process)"

# The release path, in the order it runs. Publishing itself is not a task: cut a tag
# (`git tag v0.2.0 && git push origin v0.2.0`) and `.github/workflows/release.yml` does the rest.
# What the tasks below give you is everything up to that — the checks a tag would otherwise discover
# on a runner, four minutes later, with the version already spent.

# Three cheap things, none of which needs a build:
#
#   - `goreleaser check` reads .goreleaser.yaml, including the `version: 2` schema marker and the
#     `-X gitpair/internal/cli.Version=` path, which a module rename would silently invalidate.
#   - `sh -n` on the installer. It is /bin/sh, it is run by people who pipe curl into it, and a syntax
#     error there is a broken install for everyone, found by whoever ran the release.
#   - the `release.extra_files` globs resolve. goreleaser reads them only in the publish pipe, and
#     `--snapshot` ignores publish errors — a typo there is a green local run and a red release, which is
#     the worst place to learn it. The paths are read out of .goreleaser.yaml rather than repeated here,
#     so the check cannot drift from the thing it checks.
#   - the notices file against the dependency graph. `go mod edit -require` changing a licence should
#     fail a build, not turn the shipped notices into a document that describes someone else's build.
#   - the three places that name the release repository agree. `slug=` in the installer decides where
#     people download from; README and `.goreleaser.yaml`'s release header tell them that URL. A release
#     page pointing somewhere the installer does not go is invisible until someone installs the wrong
#     thing, and it is one grep to rule out.
[tasks."release:check"]
run = """
set -eu
goreleaser check
sh -n packaging/install.sh
sed -n '/^release:/,/^$/p' .goreleaser.yaml | grep -oE 'glob: +[.]/[^ ]+' | sed 's/glob: *//' |
  while read -r glob; do
    if [ ! -f "$glob" ]; then
      echo ".goreleaser.yaml names release.extra_files $glob, and nothing is there"
      exit 1
    fi
  done
slug=$(awk -F= '/^slug=/{print $2; exit}' packaging/install.sh)
if [ -z "$slug" ]; then
  echo 'packaging/install.sh no longer names the release repository in its slug= line'
  exit 1
fi
for f in README.md .goreleaser.yaml; do
  if ! grep -q "github.com/$slug" "$f"; then
    echo "$f never names github.com/$slug, which is where packaging/install.sh downloads from"
    exit 1
  fi
done
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
bash scripts/gen-third-party-notices.sh "$tmp" >/dev/null
if ! cmp -s "$tmp" packaging/THIRD-PARTY-NOTICES.md; then
  echo "packaging/THIRD-PARTY-NOTICES.md is not what these dependencies produce:"
  diff -u packaging/THIRD-PARTY-NOTICES.md "$tmp" | sed -n '1,40p'
  echo "regenerate it: bash scripts/gen-third-party-notices.sh"
  exit 1
fi
"""
description = "goreleaser config, installer syntax, and notices matching the dependency graph"

# Every published artefact, locally, with nothing published: the four archives and checksums.txt land in
# dist/. `--skip=publish` is what keeps a local run local — goreleaser publishes into this repository, so
# without it a rehearsal would create a real release carrying a snapshot version.
[tasks."release:snapshot"]
run = """
set -eu
goreleaser release --snapshot --skip=publish --clean
ls -1 dist/git-pair_*.tar.gz dist/checksums.txt
"""
description = "Cross-compile every published target into dist/ without publishing"

# The replay that has to happen between the build and the publish: it drives packaging/install.sh against
# dist/ over a local HTTP server, so the release proves it is installable before anyone can install it.
# Deliberately outside `gates`, which every change pays for and which does not need goreleaser or a socket.
[tasks."release:gate"]
run = """
set -eu
bash scripts/gates/install-sh.sh
"""
depends = ["release:snapshot"]
description = "Replay packaging/install.sh against dist/ (needs python3)"
