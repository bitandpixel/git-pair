# The repository's own tests, run before anything is merged.
#
# `mise run gates` is the repository's definition of "done", so it is what CI runs: it depends on `check`
# (gofmt, vet, the sharded suite) and then runs the scripted replays — the PRD §29 loop, the pty TUI
# walkthrough, and the CI merge job — each against scratch repositories it builds itself. Listing those four
# commands here instead would put a second definition of the gate in YAML, where it can drift from the task
# it is supposed to mirror.
#
# The other half of the pair is `.github/workflows/git-pair-integrate.yml`, which merges a declared changeset
# onto trunk. It is a separate file because the two ask for different tokens — this one reads, that one writes
# — and because a reader who renames one should look at the other: `scripts/ci/gh-request-ci.sh` asks the
# destination to run *this* file by name after a merge, so renaming it moves that default too.
#
# Why it no longer runs on every branch push. It used to, for one reason stated in this file's own words:
# the merge job's probe (`--require-ci`, `scripts/ci/gh-head-green.sh`) read the checks on a *branch head*,
# and a `pull_request` run reports its checks against the PR's merge ref, so a repository that tested only
# pull requests left that job unable to prove any head green. The merge job now answers the testing question
# itself, by building the candidate and running this same ladder against it before it pushes
# (`--verify-cmd`, in `scripts/ci/git-pair-integrate.sh`). Nothing reads branch-head checks any more, and a
# branch with no declaration was paying twice for the same commits — once here, once at the merge. Billing
# counts a job that starts, so the trigger is the lever: a branch that has not been declared starts no run.
# A repository that wants a check on every head can add `push: branches: ['**']` back; the merge job does not
# need it, and `git pair change integrate` will still merge on the candidate's own green.
#
# `jdx/mise-action` is what installs mise, and with it the Go pinned in `.mise.toml`. If a third-party action
# in the hot path is not wanted: `actions/setup-go@v5` with `go-version-file: go.mod`, and the replays
# invoked directly — at the cost named above, two definitions of the gate.
name: CI

on:
  # The preview: the suite on a branch before anybody declares it, for the reader who wants to see it pass
  # first. A pull request from a fork runs here with a read-only token, which is all this job needs.
  pull_request:

  # Two readers for this trigger, and both are the reason it stays.
  #
  #   - `scripts/ci/gh-request-ci.sh` runs this file by name after a merge. The merge is pushed with the
  #     merging job's own token, and GitHub creates no runs for events a token caused, so trunk keeps a tip
  #     nothing built unless somebody asks — this is that ask, and it is safe to make because this file
  #     merges nothing.
  #   - a person who wants the ladder on a commit they choose, without pushing anything.
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch supersedes the run before it. Cancelling the older one is safe here because nothing in
# this workflow publishes anything; it reads and throws away.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      # The whole ladder. The pty walkthrough is the timing-sensitive one — it needs a real terminal and it
      # has been known to fail on a loaded machine and pass on an idle one. Re-run it before believing a
      # failure there; if it keeps failing, the shard count in scripts/test-sharded.sh is the dial, not this
      # gate.
      - run: mise run gates
