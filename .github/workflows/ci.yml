# The repository's own tests.
#
# `mise run gates` is the repository's definition of "done", so it is what CI runs: it depends on `check`
# (gofmt, vet, the sharded suite) and then runs the scripted replays — the PRD §29 loop, the pty TUI
# walkthrough, and the CI merge job — each against scratch repositories it builds itself. Listing those four
# commands here instead would put a second definition of the gate in YAML, where it can drift from the task
# it is supposed to mirror.
#
# This file also has a second job: `git-pair-integrate.yml` triggers on this workflow finishing, and names it
# by `name:` below. Renaming this workflow means renaming it there, or the merge job waits for a run that
# will never come.
#
# `jdx/mise-action` is what installs mise, and with it the Go pinned in `.mise.toml`. If a third-party action
# in the hot path is not wanted: `actions/setup-go@v5` with `go-version-file: go.mod`, and the replays
# invoked directly — at the cost named above, two definitions of the gate.
name: CI

on:
  push:
    # Every branch, not just trunk. This is the trigger the merge job depends on: it reads the checks on a
    # *branch head*, and a `pull_request` run reports its checks against the PR's merge ref rather than
    # against the head. A repository that ran CI only on pull requests would leave that job unable to prove
    # any head green — correctly, and silently. Branches that also carry a pull request get both runs; if
    # the duplicate minutes matter and the repository does not take forks, drop `pull_request` below.
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch supersedes the run before it. Cancelling the older one is safe here because nothing in
# this workflow publishes anything; it reads and throws away.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      # The whole ladder: gofmt, vet, the sharded suite, then the three replays. The pty walkthrough is the
      # timing-sensitive one — it needs a real terminal and it has been known to fail on a loaded machine
      # and pass on an idle one. Re-run it before believing a failure there; if it keeps failing, the shard
      # count in scripts/test-sharded.sh is the dial, not this gate.
      - run: mise run gates
