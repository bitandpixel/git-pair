# The merge a declaration asks for.
#
# One job, one command, one tree. `git pair change integrate` writes a commit whose message carries the
# `Review-State: integrating` trailer, that commit arrives as a push, and this job answers it by building the
# merge the destination would get, running the repository's own suite against it, and pushing it if it passes.
# That is the transferable rule, and it is the reason this file is shipped as a sample: the landing is
# conditional on the tests the destination would run, whatever command produces them.
#
# The command in this file is `mise run gates` — this repository's value at that seam, the same one
# `.github/workflows/ci.yml` runs on a pull request and the definition of "done" here (see that file for why
# the ladder is one line and not a list of steps). Worth telling the two apart while reading: the shape below
# is what to copy, and `mise` is what this repository happens to build with.
#
# What is deliberately not here:
#
#   no scheduled poll    a `*/15 * * * *` schedule costs 96 jobs a day whether or not anything is waiting, and
#                        the run that merges on a timer does not know what the declaration was, so it has to
#                        re-derive it from the queue. The push trigger below carries the declaration instead.
#   no `workflow_run`    waiting for another workflow to finish, then merging what it certified, merges a
#                        branch head — not the tree the destination would become. This job builds that tree
#                        itself and runs the suite against it: the same question, asked of the right commit,
#                        with no second workflow to keep in sync and no check-run to interpret.
#   no dispatch to trunk `workflow_dispatch` on the trunk branch used to run the driver against every branch,
#                        which is a poll triggered by hand. Dispatch is still unfiltered below — see "why"
#                        above the `if:` — because it is the recovery path when a run died before its push.
#
# Why the trigger is a push, and the filter is in `if:`. The event that asks for a merge is the author's
# declaration, and that commit is a push like any other. A push trigger cannot be filtered by git-pair's state
# — the workflow file is read before anything is asked of the repository — so the condition lives in the job's
# `if:`. It has to be there rather than in a step: GitHub bills a job that starts, so the number of jobs is
# what the spending limit measures, and a guard step that exits early still costs the minute a guard `if:`
# saves.
#
# One accepted over-match: any push whose message *quotes* the trailer starts a job here. The driver reads the
# marker out of the branch's own history and finds nothing to merge for such a push, so the job is inert. A
# step cannot take its place — the minute is already spent once the job has started.
#
# Why `pull_request` does not reach this job. A pull request is not a declaration, and a pull request from a
# fork is given a read-only token, so that job could report on a merge it is not permitted to make: a minute
# spent to say nothing. The pull request's run is in `.github/workflows/ci.yml`, where it is the whole point.
#
# Why `workflow_dispatch` is never filtered. When a run dies after the merge commit and before the push, the
# branch still carries the declaration and the fix is to run the job again — from the Actions page, or
# `gh run rerun <id> --repo bitandpixel/git-pair` against the original run, which keeps one log per landing.
# Filtering the manual trigger would leave that path needing a force-push to reproduce a push event.
#
# Do not retry a failed declaration with `git pair change unready` followed by `change ready`. That sequence
# withdraws the approval the merge is gated on and rebuilds it, so the retry destroys the thing it is trying to
# act on. The driver is idempotent — a re-run on a branch that has already landed says so and exits 0.
#
# What this job needs:
#
#   permissions          `contents: write` is the ask for the merge, because the merge is an ordinary commit
#                        on the destination branch. There is no second push: git-pair writes no ref, so this
#                        job has no namespace to publish into and nothing to keep in sync with the merge
#                        (PRD §13.4). `actions: write` is for one thing that is not the merge: the request
#                        below that trunk's new tip be tested. It is not about landing — a request is an ask,
#                        not a caused event, and making one is what this scope buys. What stays dropped is
#                        `checks: read` and `statuses: read`: those belonged to the probe, and a job that
#                        tests its own candidate has no head-check to consult. A token asks for what the job
#                        uses.
#   branch protection    a protected trunk is the real setup cost. `GITHUB_TOKEN` cannot be added to a bypass
#                        list, so on a repository that restricts pushes to `main` this job needs a Ruleset
#                        bypass actor of its own (a GitHub App, or a deploy key with a role) and that token in
#                        the push remote — `git remote set-url` with it, not the checkout's default. An
#                        unprotected trunk, which is what this repository has, needs nothing.
#   a test command       the rule the job exists to enforce, and the one seam the shape exposes. `--verify-cmd`
#                        is what makes the merge conditional on the suite, and its value is a per-repository
#                        choice: `mise run gates` below is this repository's, not a requirement of the shape.
#                        A repository with no such command drops the flag and the job merges on the gate alone
#                        — which is the honest shape for a repository whose tests are somebody else's business,
#                        and the wrong one for this file.
#
# The driver keeps `--require-ci` and `--ci-probe` for consumers that want a merge gated on a forge's checks
# as well as (or instead of) the candidate's own run, and `scripts/gates/ci-integrate.sh` replays those paths
# without a runner. This file passes neither: the candidate is tested before the push, so there is no
# head-check to trust.
#
# It does pass `--ci-request`, and the reason is a paper trail rather than information. The tree the
# destination keeps is the tree this job just tested, so a run on it adds no answer — but a trunk with no run
# of its own has nothing to go red, and nothing to notify anybody about when the merge is where the trouble
# was. The push that landed it cannot cause that run itself (it came from this job's token, and GitHub creates
# no runs for what a token caused), so the ask is made by name against `.github/workflows/ci.yml`, which
# merges nothing. A refused ask is said out loud and does not undo the landing; a missing token makes the ask
# unanswerable, which is the failure mode worth a comment because it looks like success.
name: git-pair integrate

on:
  push:
    # Every branch, because a changeset branch is where a declaration is pushed and the trigger cannot read
    # git-pair's state. What a branch costs here is one job, filtered by `if:` below before it starts.
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Changeset branch to integrate (default: every branch whose declaration the queue reports)'
        required: false
        type: string

# `contents: write` for the merge, `actions: write` for the ask that follows it. See "permissions" above.
permissions:
  contents: write
  actions: write

# One merge at a time per ref. Two jobs that both see the same declaration would make two merge attempts, and
# the second one's push would be refused after its merge commit already existed locally — a confusing failure
# that costs nothing to prevent. `cancel-in-progress: false` because a job that has merged has to finish its
# push; a job superseded mid-merge leaves a destination half-written and a log that says nothing.
concurrency:
  group: git-pair-integrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    # An allowlist of the two situations this job is for, rather than a denylist of the ones it is not — a
    # denylist silently admits whatever trigger is added next, and the next one is usually a `pull_request`
    # variant that has no write token to merge with. No condition here may admit `pull_request`: see the
    # paragraph above the trigger block. The trailer match is `contains()` on the whole message, not on the
    # subject line: `git pair change integrate` writes `Review-State:` as a trailer, below the subject and the
    # body, and a check on the head of the string would never fire.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref_name != (vars.GIT_PAIR_BASE || 'main') &&
       contains(github.event.head_commit.message, 'Review-State: integrating'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The full history, not the tip. The gate reads the approval out of the source's history, and a landing
      # is read out of the destination's — both walk commits, so a shallow clone answers "no review" about work
      # that was reviewed. `fetch-depth: 0` is what makes those answers true.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `jdx/mise-action` installs mise, and with it the Go pinned in `.mise.toml`. It sits at the same seam
      # as the verify command below — this repository's toolchain, not part of the shape a consumer copies.
      # The note on the choice, and on the `setup-go` alternative, is at the top of
      # `.github/workflows/ci.yml`, where the ladder is defined; the same trade applies here, and this job
      # would be the second definition if it listed the ladder's steps instead of calling the task.
      - uses: jdx/mise-action@v3

      # The binary this job gates with, named out loud. `mise run build` installs under the name
      # scripts/install-name.sh derives from the branch, so that a replay cannot quietly run a build a
      # different worktree left in the shared ~/.local/bin — the reason that script exists. On a runner the
      # directory is per-job and nothing is shared, but the name is still the branch's, so the plain
      # `git-pair` the driver would otherwise fall back to does not exist here. `GIT_PAIR_BIN` is what tells
      # the driver and the report below which binary to ask, and it is the same one the candidate is tested
      # with.
      - name: build git-pair
        run: |
          set -eu
          mise run build
          printf 'GIT_PAIR_BIN=%s\n' "$HOME/.local/bin/$(sh scripts/install-name.sh)" >> "$GITHUB_ENV"

      - name: gate it, test the candidate, merge it, push it
        env:
          # Passed to git-pair as --default-branch below, and used as the destination when a changeset's own
          # destination names no branch. Set it as a repository variable to move off `main`.
          GIT_PAIR_DEFAULT_BRANCH: ${{ vars.GIT_PAIR_BASE || 'main' }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHOSEN: ${{ inputs.branch }}
          # The commit this push carried. `--expect-head` is what keeps the merge from landing a head that
          # arrived after this event was created: the candidate the job tests is built from the commit the
          # declaration named, not from whatever the branch reached while the job was starting.
          PUSHED: ${{ github.event.after }}
          # The request hook asks GitHub for a run, and `gh` authenticates from this. Without it the hook
          # answers "cannot tell", the job says so and stays green — so the missing paper trail would be a
          # line in a log nobody reads rather than a failure anyone would see.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # The merge commit is authored by this job. Saying so in the identity is honest: the approval
          # author is in the review markers, and the merger is the one who did the merge.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # This repository's value at the one seam the shape exposes: the merge is conditional on the suite,
          # and `mise run gates` is what green means here. `gates` builds first, so the binary the gate runs is
          # the one this tree produced — and it is the tree *after* the merge, which is the combination no run
          # on the branch itself has ever seen.
          #
          # The candidate runs in this step's environment, which exports `GIT_PAIR_DEFAULT_BRANCH` and carries
          # every Actions variable — and that changes nothing below, because the suite does not read its
          # environment for configuration. That is a property of the tests, not of this job: `TestMain` takes
          # the `GIT_PAIR_` family away from the Go package, and `job_env` in the gate takes it away from every
          # driver the bash gates run, the same way they already pin `GIT_CONFIG_GLOBAL`. The pair that keeps
          # it true is the step `the replay cannot reach the forge` in scripts/gates/ci-integrate.sh.
          VERIFY_CMD='mise run gates'
          set -- --verify-cmd "$VERIFY_CMD"
          # Named rather than left to the driver's default, because the file claims the ask in its own header:
          # a reader should see the request here, and the gate asserts this line exists beside the scope that
          # makes it. The helper asks `.github/workflows/ci.yml` to run the destination branch — a file that
          # merges nothing, which is what makes the ask safe.
          set -- "$@" --ci-request scripts/ci/gh-request-ci.sh
          case "$EVENT" in
            workflow_dispatch) [ -n "$CHOSEN" ] && set -- "$@" "$CHOSEN" ;;
            *) [ -n "$REF_NAME" ] && [ "$REF_NAME" != "$GIT_PAIR_DEFAULT_BRANCH" ] && set -- "$@" "$REF_NAME" ;;
          esac
          [ "$EVENT" = push ] && [ -n "$PUSHED" ] && set -- "$@" --expect-head "$PUSHED"
          scripts/ci/git-pair-integrate.sh "$@"

      # The log a human reads. After the run it answers the only two questions that matter here: what is still
      # waiting, and what landed without a review. `if: always()` because it is most wanted after the step
      # above failed — and a step that prints to the log is not the minute this job costs, so it cannot be cut
      # for budget.
      - name: what the queue says now
        if: always()
        run: '"${GIT_PAIR_BIN:-git-pair}" queue'
