# The merge a declaration asks for.
#
# An author only asks (PRD §9.9): `git pair change integrate` writes a commit that says "this is ready to be
# integrated", and pushes it. What performs the merge is whatever the destination branch's owner decides to
# run, and this is one shape of that — ordinary git, run by a job that is allowed to touch the branch, with
# the record written afterwards by the command that verifies it. Nothing here is a git-pair subcommand; the
# logic lives in scripts/ci/git-pair-integrate.sh so it can be replayed without a runner (§scripts/gates/
# ci-integrate.sh).
#
# Two triggers, because the declaration and the merge are not the same event:
#
#   push to a feature branch   the cheap path — the branch just moved, so ask the gate about it now
#   schedule                   the poll path — the queue is already the list of things somebody asked for,
#                              so this needs no event at all: a declaration pushed from a laptop, an
#                              approval written an hour later, both get picked up
#
# The gate refuses anything that is not both ready and declared, so a red-free run usually means "nothing to
# do yet", which is the point: a job that is red until somebody declares something teaches nobody anything.
name: git-pair integrate

on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to integrate; blank runs every changeset the queue reports'
        required: false
        type: string

# The merge commit is a commit on the destination branch, and the record is a ref write. `contents: write`
# covers both: the merge is pushed as an ordinary commit and the pair under refs/git-pair/ is pushed by
# `integration publish`, unforced.
permissions:
  contents: write

# One merge at a time per ref. Two jobs that both see the same declaration would make two merge attempts,
# and the second one's push would be refused after its merge commit already existed locally — a confusing
# failure that costs nothing to prevent.
concurrency:
  group: git-pair-integrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      # The full history, not the tip. `integration record` verifies that `--commit` really added
      # changesets/<id>/ to the destination, and the gate reads the approval out of the source's history:
      # both need commits, not a snapshot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build git-pair
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/git-pair" ./cmd/git-pair
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gate it, merge it, record it, publish it
        env:
          # Passed to git-pair as --default-branch below, and used as the destination when a changeset's own
          # destination names no branch. Set it as a repository variable to move off `main`.
          GIT_PAIR_DEFAULT_BRANCH: ${{ vars.GIT_PAIR_BASE || 'main' }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CHOSEN: ${{ inputs.branch }}
        run: |
          set -uo pipefail
          # The merge commit is authored by this job. Saying so in the identity is honest: the approval
          # author is in the review markers, and the merger is the one who did the merge.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set --
          case "$EVENT" in
            push) set -- "$REF_NAME" ;;
            workflow_dispatch) [ -n "$CHOSEN" ] && set -- "$CHOSEN" ;;
          esac
          scripts/ci/git-pair-integrate.sh "$@"

      # The log a human reads. After the run it answers the only two questions that matter here: what is
      # still waiting, and what landed without a record.
      - name: what the queue says now
        if: always()
        run: git-pair queue
