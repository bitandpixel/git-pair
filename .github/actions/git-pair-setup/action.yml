# This repository's preparation, called by both git-pair jobs. The profile owns the path — `.github/workflows/
# git-pair-check.yml` and `.github/workflows/git-pair-integrate.yml` each run this directory behind
# `if: ${{ hashFiles('.github/actions/git-pair-setup/action.yml') != '' }}`, so GitHub skips the step before it
# resolves the path when the file is absent — and the bytes here are this repository's, because a runner is nobody
# else's to configure. `dev-profiles install` never writes here, and `doctor` compares nothing in this file: it asks
# that the file exists, and that it is a composite action. Name it `action.yml`; GitHub accepts `action.yaml` too,
# the guard above reads only this name, and a repository believing it prepared a runner that was never prepared is
# the failure `doctor` refuses to leave silent.
#
# The step sits after `scripts/ci/install-git-pair.sh` put a pinned published release on PATH, in both jobs. That
# order is the reason this file exists: this repository's merge cannot be gated by a release that does not contain
# the change under review, so the build here replaces the installer's binary and exports `GIT_PAIR_BIN` for the
# steps that follow — the gate, the candidate build, and the queue report at the end of the merge job all ask that
# named tool.
#
# The work stays in `scripts/ci/prepare-toolchain.sh` rather than becoming YAML steps because that script is
# runnable on a developer machine — a person in a checkout and the gate replays under `scripts/gates/` both use it
# — and a composite action is not. What the action adds is the shape a nested step has to have: `using: composite`,
# and a shell that carries the script's exit code as the step's failure. A setup that fails here fails the run,
# which is where a person is still looking at it; `continue-on-error` would put a broken preparation behind a green
# job, and this repository's CI is what the merge is conditional on.
#
# What does not belong here: `${{ secrets.X }}` — GitHub fails to load the file rather than passing an empty string,
# so a token is declared as this repository's own secret where it is actually used. And cache what the preparation
# downloads, not what it builds: this action runs against the branch head in the check job while `verify` runs
# against the merge commit in the merge job, so a key built from one tree's output describes neither. Neither job
# cached anything before this file existed, so leaving no cache here is the status quo rather than a regression.

name: git-pair setup
description: Install mise and the Go .mise.toml pins, build this tree's git-pair, and export GIT_PAIR_BIN for the steps after this one.

runs:
  using: composite
  steps:
    - name: prepare the toolchain
      run: ./scripts/ci/prepare-toolchain.sh
      shell: bash
